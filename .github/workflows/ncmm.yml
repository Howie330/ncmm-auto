name: ncmm daily tasks

on:
  schedule:
    # GitHub 用 UTC。下面对应北京时间每天 0:09 与 13:09 各跑一次
    - cron: '9 16,5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ncmm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 下载 ncmm (Linux)
        run: |
          VER=$(curl -sL https://api.github.com/repos/3899/ncmm/releases/latest | grep -oP '"tag_name"\s*:\s*"\K[^"]+')
          echo "ncmm version: $VER"
          URL="https://github.com/3899/ncmm/releases/download/${VER}/ncmm_Linux_x86_64.tar.gz"
          echo "Downloading $URL"
          curl -fL -o ncmm.tar.gz "$URL"
          tar -xzf ncmm.tar.gz
          chmod +x ncmm
          ./ncmm --version

      - name: 准备 home 目录
        run: mkdir -p "$HOME/ncmm-home"

      - name: Cookie 登录主账号
        env:
          NCMM_MAIN_COOKIE: ${{ secrets.NCMM_MAIN_COOKIE }}
        run: |
          printf '%s' "$NCMM_MAIN_COOKIE" > cookie.txt
          ./ncmm --home "$HOME/ncmm-home" login cookie -f cookie.txt -m

      - name: 运行全部批量任务 (签到/云贝/乐迷团/推歌等)
        run: |
          ./ncmm --home "$HOME/ncmm-home" task 2>&1 | tee task.log

      - name: 运行音乐人任务 (需已认证音乐人，否则自动跳过)
        run: |
          ./ncmm --home "$HOME/ncmm-home" musician 2>&1 | tee musician.log || true

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncmm-logs
          path: |
            task.log
            musician.log
          retention-days: 7
          if-no-files-found: warn

      - name: 失败时自动开 Issue 提醒 (如 Cookie 失效)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ncmm-alert --color d73a4a --description "ncmm run alert" 2>/dev/null || true
          COUNT=$(gh issue list --state open --label ncmm-alert --json number --jq 'length')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "已存在 $COUNT 个未关闭的告警 Issue，跳过创建"
          else
            gh issue create --title "ncmm 云端任务执行失败（多为 Cookie 失效）" --label ncmm-alert --body "云端 ncmm 任务执行失败，最常见原因是网易云 Cookie 失效。处理办法：更新仓库 Secret NCMM_MAIN_COOKIE（从本机 C:\\ncmm\\cookie.json 取 MUSIC_U 与 __csrf，或重新扫码登录后更新）。运行日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
